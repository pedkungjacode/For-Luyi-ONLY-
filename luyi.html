<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ถึงหรูยี่ ✦ จากเรย์ด้า</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#07061a;--card:#ffffff12;--ink:#e9e6ff;--pri:#8f7bff;--soft:#ffffff14;--mut:#a9a3d9;--glow:#6fd8ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;color:var(--ink);font-family:'Prompt','Sarabun',system-ui,sans-serif;font-weight:300;line-height:1.6;min-height:100vh;
background:radial-gradient(ellipse at 20% 0%,#2b1b6b99,transparent 55%),radial-gradient(ellipse at 90% 40%,#0e4a7a77,transparent 55%),radial-gradient(ellipse at 10% 100%,#4a1b6b88,transparent 50%),var(--bg);background-attachment:fixed}
body:before,body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-repeat:repeat}
body:before{background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 120px,#cfe,transparent),radial-gradient(1.5px 1.5px at 160px 60px,#fff,transparent),radial-gradient(1px 1px at 230px 180px,#bdf,transparent),radial-gradient(2px 2px at 300px 90px,#fff,transparent);background-size:330px 220px;animation:tw 5s ease-in-out infinite alternate}
body:after{background-image:radial-gradient(1px 1px at 50px 70px,#fff,transparent),radial-gradient(1.5px 1.5px at 140px 160px,#fde,transparent),radial-gradient(1px 1px at 260px 30px,#fff,transparent);background-size:290px 200px;animation:tw 7s ease-in-out infinite alternate-reverse}
@keyframes tw{from{opacity:.25}to{opacity:1}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.w{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:16px 14px 80px}
.hero{text-align:center;padding:26px 8px 10px}.hero .big{font-size:60px;display:inline-block;animation:fl 6s ease-in-out infinite;filter:drop-shadow(0 0 18px #8f7bffaa)}
.hero h1{font-size:22px;font-weight:400;margin:8px 0;letter-spacing:.5px;background:linear-gradient(90deg,#b9a8ff,#6fd8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);margin:0;font-size:14px}
.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{flex:1}
button,.btn{font:inherit;border:1px solid #ffffff22;border-radius:14px;padding:11px 14px;background:var(--soft);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
button.on,.pri{background:linear-gradient(135deg,#7b61ff,#3aa7ff);border-color:transparent;color:#fff;font-weight:400;box-shadow:0 0 18px #6a7dff66}
.card{background:var(--card);border:1px solid #ffffff1f;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:22px;padding:16px;margin:14px 0;box-shadow:0 0 28px #5b3fff22}
.card .em{font-size:36px;line-height:1;filter:drop-shadow(0 0 10px #6fd8ff88)}.card h3{margin:8px 0 10px;font-size:16px;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:8px 14px;border-radius:999px;background:#ffffff10;cursor:pointer;border:1px solid #ffffff2a;user-select:none}
.chip.on{border-color:var(--glow);background:#3aa7ff33;color:#fff;box-shadow:0 0 14px #6fd8ff88}
.chip b{display:inline-block;min-width:20px;margin-right:4px;color:var(--glow)}
input[type=text],textarea{width:100%;font:inherit;border:1px solid #ffffff2a;border-radius:12px;padding:10px;margin-top:10px;background:#0b0a2488;color:var(--ink);outline:none}
input:focus,textarea:focus{border-color:var(--glow);box-shadow:0 0 12px #6fd8ff55}
::placeholder{color:#8d87c4}
textarea{min-height:90px}.hint{font-size:13px;color:var(--mut);margin:0 0 8px}
.bar{position:sticky;bottom:0;padding:10px 0;background:linear-gradient(transparent,var(--bg) 35%)}.bar button{width:100%;font-size:17px}
.qa{padding:8px 0;border-bottom:1px dashed #ffffff22}.qa small{color:var(--mut);display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.row>*{flex:1}
.dng{border-color:#ff6b8a88;color:#ffb3c2}
.hid{display:none}
</style></head><body><div class="w">
<div class="hero"><div class="big">🪐</div><h1>สวัสดีหรูยี่ เรย์ด้าเองจ้า</h1><p>ลองล่องลอยไปกับคำถามเหล่านี้ดูนะ ✦ ตอบตามใจได้เลย</p></div>
<div class="tabs"><button id="t1" class="on">✦ ตอบคำถาม</button><button id="t2">🌌 ประวัติ</button></div>
<div id="form"></div><div id="hist" class="hid"></div>
</div>
<script>
const Q=[
{id:'food',e:'🍗',t:'ชอบกินอะไรมากสุด (แตะเรียงลำดับ 1,2,3...)',k:'rank',o:['ข้าวมันไก่ 🍗','ข้าวขาหมู 🐖','ก๋วยเตี๋ยวเรือ 🍜','บะหมี่เกี๊ยว 🥟']},
{id:'ice',e:'🍦',t:'ชอบไอติมรสอะไร',k:'chip',o:['ช็อกโกแลต 🍫','วานิลลา 🍨','มินต์ 🌿','มะนาว 🍋']},
{id:'fruit',e:'🍓',t:'ผลไม้ที่ชอบกิน',k:'text'},
{id:'dream',e:'🏰',t:'สถานที่ในฝัน',k:'text'},
{id:'color',e:'🎨',t:'สีที่ชอบมากที่สุด',k:'text'},
{id:'draw',e:'🖌️',t:'เวลาวาดรูปชอบคิดถึงอะไร หรืออยากวาดอะไรถ้าไม่มีหัวข้อกำหนด',k:'long'},
{id:'paint',e:'🖍️',t:'เลิฟสีอะไรที่สุด',k:'chip',o:['สีน้ำ 💧','สีไม้ 🖍️','สีโปสเตอร์ 🎨','ดินสอสี ✏️']},
{id:'km',e:'💞',t:'คุณคิดว่าตัวเองเป็นเคะ หรือเมะ หรือทั้งคู่',k:'one',o:['เคะ 🌷','เมะ 🔥','ทั้งคู่ 💫']},
{id:'uni',e:'🎓',t:'อยากเรียนมหาวิทยาลัยอะไรในอนาคต',k:'text'},
{id:'job',e:'💼',t:'อาชีพในอนาคต',k:'text'},
{id:'pet',e:'🐾',t:'ชอบสัตว์อะไรที่สุด',k:'chip',o:['แมว 🐱','หมา 🐶','กระต่าย 🐰','หมีแพนด้า 🐼']},
{id:'dis1',e:'🙅',t:'ไม่ชอบกินอะไร (ของคาว)',k:'text'},
{id:'dis2',e:'🙅‍♀️',t:'ไม่ชอบกินอะไร (ของหวาน)',k:'text'},
{id:'shoe',e:'👟',t:'ใส่รองเท้าเบอร์อะไร',k:'text'},
{id:'doll',e:'🧸',t:'ชอบตุ๊กตาอะไรที่สุด',k:'text'},
{id:'art',e:'🖼️',t:'งานศิลปะแบบไหนที่โดนใจที่สุด อธิบายละเอียดๆ เลยนะ',k:'long'},
{id:'dn',e:'🌗',t:'ยี่คิดว่าชอบกลางวันหรือกลางคืน',k:'one',o:['กลางวัน ☀️','กลางคืน 🌙']},
{id:'gal',e:'🐠',t:'ถ้ามีโอกาส อยากไปหอศิลป์หรืออควาเรียมมากกว่ากัน',k:'one',o:['หอศิลป์ 🖼️','อควาเรียม 🐠']},
{id:'pow',e:'✨',t:'ถ้ามีพลังพิเศษ อยากได้อะไร เพราะอะไร',k:'chip',o:['ล่องหน 👻','วาร์ปได้ 🌀','บินได้ 🕊️','ย้อนเวลาได้ ⏳'],why:1},
{id:'mbti',e:'🧠',t:'MBTI ของคุณ',k:'text'},
{id:'mov',e:'🎬',t:'ชอบดูหนังแนวไหน',k:'text'},
{id:'free',e:'🛋️',t:'เวลาว่างๆ ชอบทำอะไร',k:'long'},
{id:'cin',e:'🍿',t:'เคยไปดูหนังในโรงกับเพื่อนมั้ย',k:'one',o:['เคย 🍿','ยังไม่เคย 🥺']},
{id:'ba',e:'👭',t:'บอนนี่เอมี่ หรือ เอมี่บอนนี่',k:'one',o:['บอนนี่เอมี่','เอมี่บอนนี่']},
{id:'mama',e:'🍜',t:'ชอบกินมาม่ารสอะไร',k:'text'},
{id:'late',e:'🌙',t:'อาหารมื้อดึกสุดโปรด',k:'text'},
{id:'mall',e:'🛍️',t:'สถานที่ที่ยี่เลือกจะไปถ้าได้เดินห้าง',k:'text'},
{id:'wish',e:'🌠',t:'ถ้าขอพรได้ 1 ข้อจะขอว่าอะไร',k:'long'}];
const KEY='ruyi_draft2',HK='ruyi_hist2';
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let S=ld(KEY,{});
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ans(q,s){s=s||S;const a=s[q.id];if(!a)return '';
 if(q.k==='rank')return (a.r||[]).map((x,i)=>(i+1)+'. '+x).concat(a.o?['+ '+a.o]:[]).join(', ');
 if(q.k==='chip'||q.k==='one'){const p=[];if(a.v)p.push(a.v);if(a.o)p.push(a.o);if(a.w)p.push('เพราะ '+a.w);return p.join(' / ')}
 return a.t||''}
function save(){sv(KEY,S)}
function render(){
 let h='';
 Q.forEach(q=>{const a=S[q.id]||{};
  h+=`<div class="card"><div class="em">${q.e}</div><h3>${esc(q.t)}</h3>`;
  if(q.k==='rank'){h+='<p class="hint">แตะตามลำดับที่ชอบ แตะซ้ำเพื่อยกเลิก</p><div class="chips">'+q.o.map((o,i)=>{const n=(a.r||[]).indexOf(o);return `<span class="chip ${n>=0?'on':''}" data-q="${q.id}" data-o="${esc(o)}" data-k="rank">${n>=0?'<b>'+(n+1)+'</b>':''}${esc(o)}</span>`}).join('')+`</div><input type="text" placeholder="พิมพ์อย่างอื่นเพิ่มได้..." data-q="${q.id}" data-f="o" value="${esc(a.o||'')}">`}
  else if(q.k==='chip'||q.k==='one'){h+='<div class="chips">'+q.o.map(o=>`<span class="chip ${a.v===o?'on':''}" data-q="${q.id}" data-o="${esc(o)}" data-k="one">${esc(o)}</span>`).join('')+'</div>';
   if(q.k==='chip')h+=`<input type="text" placeholder="หรือพิมพ์อย่างอื่น..." data-q="${q.id}" data-f="o" value="${esc(a.o||'')}">`;
   if(q.why)h+=`<input type="text" placeholder="เพราะอะไร..." data-q="${q.id}" data-f="w" value="${esc(a.w||'')}">`}
  else if(q.k==='long')h+=`<textarea placeholder="พิมพ์ตอบได้เลย..." data-q="${q.id}" data-f="t">${esc(a.t||'')}</textarea>`;
  else h+=`<input type="text" placeholder="พิมพ์ตอบได้เลย..." data-q="${q.id}" data-f="t" value="${esc(a.t||'')}">`;
  h+='</div>'});
 h+='<div class="bar"><button class="pri" id="send">ส่งคำตอบไปหาเรย์ด้า 🚀</button></div>';
 $('form').innerHTML=h}
document.addEventListener('click',e=>{
 const c=e.target.closest('.chip');if(!c)return;
 const id=c.dataset.q,o=c.dataset.o;S[id]=S[id]||{};
 if(c.dataset.k==='rank'){const r=S[id].r=S[id].r||[];const i=r.indexOf(o);i>=0?r.splice(i,1):r.push(o)}
 else S[id].v=S[id].v===o?'':o;
 save();const y=scrollY;render();scrollTo(0,y)});
document.addEventListener('input',e=>{const t=e.target;if(!t.dataset.f)return;
 S[t.dataset.q]=S[t.dataset.q]||{};S[t.dataset.q][t.dataset.f]=t.value;save()});
function text(s,d){return 'หรูยี่ตอบแล้วจ้า 💌\n'+(d?d+'\n':'')+'\n'+Q.map(q=>q.e+' '+q.t.replace(/\s*\(.*\)/,'')+'\n→ '+(ans(q,s)||'-')).join('\n\n')}
function view(s,d,fresh){
 let h=`<div class="card"><div class="em">🌠</div><h3>${fresh?'ส่งเรียบร้อย! ขอบคุณนะหรูยี่':'คำตอบเมื่อ '+esc(d)}</h3>`;
 if(fresh)h+='<p class="hint">กดปุ่มด้านล่างเพื่อส่งคำตอบกลับไปหาเรย์ด้า (เซฟไว้ในประวัติแล้วด้วย)</p>';
 h+=Q.map(q=>`<div class="qa"><small>${q.e} ${esc(q.t)}</small>${esc(ans(q,s)||'-')}</div>`).join('');
 h+=`<div class="row"><a class="btn pri" target="_blank" rel="noopener" href="https://line.me/R/msg/text/?${encodeURIComponent(text(s,d))}">ส่งทาง LINE 💚</a><button id="cp">คัดลอก 📋</button></div></div>`;
 h+='<button id="back" style="width:100%">กลับไปตอบใหม่</button>';
 $('form').classList.add('hid');$('hist').classList.remove('hid');$('hist').innerHTML=h;
 $('cp').onclick=async()=>{const x=text(s,d);try{await navigator.clipboard.writeText(x)}catch(e){const a=document.createElement('textarea');a.value=x;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}$('cp').textContent='คัดลอกแล้ว ✅'};
 $('back').onclick=()=>tab(1);scrollTo(0,0)}
document.addEventListener('click',e=>{if(e.target.id!=='send')return;
 const d=new Date().toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'});
 const H=ld(HK,[]);H.unshift({d,s:S});sv(HK,H);view(S,d,true)});
function tab(n){$('t1').classList.toggle('on',n==1);$('t2').classList.toggle('on',n==2);
 $('form').classList.toggle('hid',n!=1);$('hist').classList.toggle('hid',n==1);
 if(n==2){const H=ld(HK,[]);$('hist').innerHTML=(H.length?H.map((x,i)=>`<div class="card"><div class="em">🛰️</div><h3>${esc(x.d)}</h3><button data-i="${i}" class="vh">เปิดดูคำตอบ</button></div>`).join('')+'<button id="clr" class="dng" style="width:100%">🗑️ ล้างประวัติทั้งหมด</button>':'<div class="card">ยังไม่มีประวัติ ท้องฟ้ายังว่างอยู่ 🌌</div>')}}
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);
document.addEventListener('click',e=>{if(e.target.className!=='vh')return;const x=ld(HK,[])[e.target.dataset.i];view(x.s,x.d,false)});
document.addEventListener('click',e=>{if(e.target.id!=='clr')return;const b=e.target;if(!b.dataset.s){b.dataset.s=1;b.textContent='แตะอีกครั้งเพื่อยืนยันการลบ';return}try{localStorage.removeItem(HK)}catch(_){}tab(2)});
render();
</script></body></html>
